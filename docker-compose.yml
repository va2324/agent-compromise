version: '5.3.1'
services: 
  host1: # vulnerable Linux host
    image: alpine
    container_name: vuln_host
    stdin_open: true
    tty: true
    command: /bin/sh -c "apk add --no-cache openssh bash && ssh-keygen -A && sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' 
            /etc/ssh/sshd_config && echo 'root:password123' | chpasswd && /usr/sbin/sshd -D"
    ports:   # sets up SSH on vuln_host & enables remote SSH login (ssh -p 22 root@vuln_host; Login with 'password123')
      - 2222:22

  host2: # host with agents
    image: agent
    container_name: agent_host
    build: .
    stdin_open: true
    tty: true
    env_file:
      - .env
    depends_on:
      - database
  
  database: # postgresql database
    image: postgres:18
    restart: always
    container_name: postgres_db
    environment: 
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql # obtains existing data from db.sql

volumes: 
  pgdata: # volume to maintain postgres data